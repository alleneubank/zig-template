name: Update Dependencies

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.10.4'

      - name: Update mise toolchain pins and lockfile
        run: mise upgrade --bump

      - name: Verify build
        run: zig build test && zig build fmt && ziglint

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/update-deps-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: update mise toolchain pins"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: update dependencies" \
            --body "Automated dependency update. Toolchain pins and mise.lock updated with mise upgrade --bump and build verified." \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
