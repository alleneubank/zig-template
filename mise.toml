[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]

[tools]
zig = "0.17.0"
# ziglint publishes no macos-x64 build; the lock has no entry for that platform.
"github:rockorager/ziglint" = { version = "0.6.2", exe = "ziglint" }
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:jqlang/jq" = "1.8.2"
"aqua:BurntSushi/ripgrep" = "15.2.0"
